[package]
name = "rsb-errors"
version = "0.1.0"
edition = "2024"
description = "Location, toggle and panic capture shared by every rsb Rust crate. See rules/standards/errors.md and panics.md."
license = "MIT"
repository = "https://github.com/rsb/errors-rs"
publish = false

[features]
# The repository checks of the standards' Check sections, for each
# consumer's `cargo xtask errors`. Off by default: a binary never needs it.
check = []

[dependencies]
snafu = "0.9"

[[test]]
name = "check"
required-features = ["check"]

[profile.release]
# Ignored when this crate is a dependency; stated because `check` asks it
# of every root manifest, this one included.
panic = "unwind"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
get_unwrap = "deny"
todo = "deny"
unimplemented = "deny"
missing_assert_message = "deny"
manual_assert = "deny"
missing_panics_doc = "deny"
string_slice = "deny"
exit = "deny"
